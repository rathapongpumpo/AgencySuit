name: Deploy to Hostinger

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: hostinger-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.HOST || '156.67.222.250' }}
      SSH_PORT: ${{ secrets.SSH_PORT || '65002' }}
      SSH_USER: ${{ secrets.SSH_USER || 'u271733843' }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      REMOTE_BASE: ${{ secrets.REMOTE_BASE || '/home/u271733843/agencysuit' }}
      PUBLIC_PATH: /home/u271733843/domains/darkgray-duck-178765.hostingersite.com/public_html

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build frontend assets
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Detect migration changes
        id: migrations
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- database/migrations; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup SSH
        run: |
          set -euo pipefail
          for required in HOST SSH_PORT SSH_USER SSH_PRIVATE_KEY REMOTE_BASE PUBLIC_PATH; do
            if [ -z "${!required:-}" ]; then
              echo "::error title=Missing deploy setting::${required} is empty. Configure the corresponding GitHub Actions secret."
              exit 1
            fi
          done
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' '[156.67.222.250]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMAvKhruqQaFLY0wf/x9hYRTJ5N5kuvY9xRh5oSkPpFr' > "$HOME/.ssh/known_hosts"
          if ! ssh -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=10 "$SSH_USER@$HOST" "true"; then
            echo "::error title=Hostinger SSH authentication failed::Check SSH_PRIVATE_KEY, SSH_USER, HOST, and SSH_PORT GitHub settings."
            exit 1
          fi

      - name: Deploy release
        env:
          MIGRATIONS_CHANGED: ${{ steps.migrations.outputs.changed }}
        run: |
          set -euo pipefail
          release="${REMOTE_BASE%/}/releases/${GITHUB_SHA}"
          ssh -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$HOST" \
            "mkdir -p '$REMOTE_BASE/releases' '$REMOTE_BASE/shared' '$release'"

          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='node_modules/' \
            --exclude='vendor/' \
            --exclude='.playwright-cli/' \
            --exclude='TASK-003-LEAN.md' \
            -e "ssh -p $SSH_PORT -o BatchMode=yes" \
            ./ "$SSH_USER@$HOST:$release/"

          ssh -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$HOST" \
            "bash -s -- '$REMOTE_BASE' '$PUBLIC_PATH' '$release' '$MIGRATIONS_CHANGED'" <<'REMOTE'
          set -euo pipefail
          trap 'status=$?; echo "::error title=Remote deploy failed::line ${LINENO}: ${BASH_COMMAND} (exit ${status})"; exit ${status}' ERR

          remote_base="$1"
          public_path="$2"
          release="$3"
          migrations_changed="$4"
          release_id="$(basename "$release")"
          shared_env="$remote_base/shared/.env"
          shared_storage="$remote_base/shared/storage"
          php_bin="/opt/alt/php84/usr/bin/php"
          composer_bin="/usr/local/bin/composer"

          test -f "$shared_env"
          test -f "$release/composer.lock"
          test -x "$php_bin"
          test -x "$composer_bin"

          rm -f "$release/.env"
          ln -s "$shared_env" "$release/.env"

          mkdir -p "$shared_storage"
          if [ -d "$release/storage" ] && [ ! -L "$release/storage" ]; then
            mv "$release/storage" "$release/storage.skeleton"
          fi
          rm -f "$release/storage"
          ln -s "$shared_storage" "$release/storage"

          cd "$release"
          "$php_bin" "$composer_bin" install \
            --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-scripts

          "$php_bin" artisan package:discover --ansi

          mkdir -p "$release/bootstrap/cache" "$shared_storage/app/private" \
            "$shared_storage/framework/cache" "$shared_storage/framework/sessions" \
            "$shared_storage/framework/views" "$shared_storage/logs"
          chmod -R ug+rwX "$release/bootstrap/cache" "$shared_storage"
          chmod 640 "$shared_env"

          if [ "$migrations_changed" = "true" ]; then
            "$php_bin" "$release/artisan" migrate --force --no-interaction
          fi

          "$php_bin" artisan optimize:clear
          "$php_bin" artisan config:cache
          "$php_bin" artisan route:cache
          "$php_bin" artisan view:cache

          current_next="$remote_base/current.next"
          rm -f "$current_next"
          ln -s "$release" "$current_next"
          mv -Tf "$current_next" "$remote_base/current"

          # Keep Laravel source outside the public web root, but make the
          # domain's public_html a real, visible folder for Hostinger's File
          # Manager. Each deploy refreshes these active public files.
          public_next="${public_path}.next-${release_id}"
          public_previous="${public_path}.previous-${release_id}"
          case "$public_next" in
            "${public_path}".next-*) ;;
            *) echo "Invalid public deployment path" >&2; exit 1 ;;
          esac

          rm -rf "$public_next"
          mkdir -p "$public_next"
          rsync -a --delete "$remote_base/current/public/" "$public_next/"

          cat > "$public_next/index.php" <<PHP
          <?php

          use Illuminate\\Foundation\\Application;
          use Illuminate\\Http\\Request;

          define('LARAVEL_START', microtime(true));

          \$appRoot = '${remote_base}/current';

          if (file_exists(\$maintenance = \$appRoot.'/storage/framework/maintenance.php')) {
              require \$maintenance;
          }

          require \$appRoot.'/vendor/autoload.php';

          /** @var Application \$app */
          \$app = require_once \$appRoot.'/bootstrap/app.php';
          \$app->handleRequest(Request::capture());
          PHP

          if [ -e "$public_path" ] || [ -L "$public_path" ]; then
            mv -Tf "$public_path" "$public_previous"
          fi
          mv -Tf "$public_next" "$public_path"
          rm -rf "$public_previous"
          REMOTE
